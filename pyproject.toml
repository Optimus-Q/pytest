requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tasks"
version = "0.1.0"
description = "Task management utilities"
authors = [
    { name="roy", email="your@email.com" }
]
readme = "README.md"
requires-python = ">=3.8"


[tool.setuptools]
package-dir = {"" = "src"}
packages = ["tasks"]

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = "src"
testpaths = ["tests"]
markers = [
    "smoke: smoke tests",
    "get: get tests"
]
xfail_strict = true